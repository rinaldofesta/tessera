[project]
name = "tessera-eval"
version = "0.2.0"
description = "Open methodology and generator for enterprise AI-agent reliability evals, built on inspect_ai."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rinaldo Festa" }]
keywords = ["evals", "ai-agents", "reliability", "benchmark", "mcp", "inspect-ai", "provenance", "refusal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# Everything `tessera ui` and a first run need after a plain install is a base
# dependency; only the long tail of provider SDKs lives behind the `providers` extra.
dependencies = [
    "inspect-ai>=0.3.232,<0.4",
    "pydantic>=2.7",
    "mcp>=1.27,<2",
    "psutil>=5.9",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# The long tail of provider SDKs inspect_ai imports at run time (anthropic and openai
# are base dependencies). Without these a model whose key is configured still fails
# mid-run with a ModuleNotFoundError.
providers = [
    "groq",
    "mistralai",
]

[project.urls]
Homepage = "https://github.com/rinaldofesta/tessera"
Repository = "https://github.com/rinaldofesta/tessera"
Issues = "https://github.com/rinaldofesta/tessera/issues"
Leaderboard = "https://github.com/rinaldofesta/tessera/blob/main/docs/leaderboard.md"
Changelog = "https://github.com/rinaldofesta/tessera/blob/main/docs/adr/README.md"

[project.scripts]
tessera = "tessera.cli:main"
tessera-report = "tessera.cli:report_alias"
tessera-leaderboard = "tessera.cli:leaderboard_alias"
tessera-api = "tessera.cli:api_alias"

[project.entry-points.inspect_ai]
tessera = "tessera.evals.task"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist keeps the repo layout (AGENTS.md, skills/, and the /learn lesson at their
# checkout paths, where the checkout reads them); only the wheel maps them into the
# package. A top-level force-include would put them in the sdist under the *target*
# path, and a wheel built from that sdist — what `uv build` and every downstream
# rebuild do — then cannot find the root files and fails. Package data
# (src/tessera/data/**) rides along with the package.
[tool.hatch.build.targets.sdist]
include = [
    "src/tessera", "AGENTS.md", "skills", "tests", "README.md", "LICENSE*", "CITATION.cff",
    "docs/tessera-lesson.html",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "tessera/data/guide/AGENTS.md"
"skills" = "tessera/data/guide/skills"
"docs/tessera-lesson.html" = "tessera/data/lesson.html"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # long lines: prose-heavy docstrings and receipts; not worth reflowing
    "B008",  # FastAPI's Depends()/Query() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# Test modules import the unit under test next to the tests that use it.
"tests/**" = ["E402"]
