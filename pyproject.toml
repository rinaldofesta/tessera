[project]
name = "tessera"
version = "0.0.0"
description = "Open methodology and generator for enterprise AI-agent reliability evals, built on inspect_ai."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rinaldo Festa" }]
keywords = ["evals", "ai-agents", "reliability", "benchmark", "mcp", "inspect-ai", "provenance", "refusal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "inspect-ai>=0.3.232,<0.4",
    "pydantic>=2.7",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/rinaldofesta/tessera"
Repository = "https://github.com/rinaldofesta/tessera"
Issues = "https://github.com/rinaldofesta/tessera/issues"
Leaderboard = "https://github.com/rinaldofesta/tessera/blob/main/docs/leaderboard.md"
Changelog = "https://github.com/rinaldofesta/tessera/blob/main/docs/adr/README.md"

[project.scripts]
tessera-report = "tessera.report.cli:main"
tessera-leaderboard = "tessera.report.cli:leaderboard_main"
tessera-api = "tessera.api.app:main"
tessera-variant = "tessera.factory.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
