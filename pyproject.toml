[project]
name = "tessera"
version = "0.0.0"
description = "Open methodology and generator for enterprise AI-agent reliability evals, built on inspect_ai."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rinaldo Festa" }]
dependencies = [
    "inspect-ai>=0.3.232,<0.4",
    "pydantic>=2.7",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
tessera-report = "tessera.report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
