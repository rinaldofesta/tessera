name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Static gates: the lockfile matches pyproject, the three version declarations agree,
  # and ruff is clean under the [tool.ruff] config in pyproject.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: bash scripts/check-version.sh
      - run: uvx ruff@0.16.5 check .
      - run: bash scripts/check-readme-assets.sh

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The declared floor is python >=3.10; test it (and the newest) rather than only 3.12.
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is key-free by design: no model API key is ever needed here. --frozen
      # installs exactly what uv.lock resolves, so CI tests the environment we ship.
      - run: uv sync --frozen --all-extras
      # --durations surfaces any test that stalls; the suite is meant to finish in seconds.
      # faulthandler dumps every thread's stack when one test exceeds 60 s, so a stall
      # shows *where* it hangs instead of only how long.
      - run: uv run --frozen pytest --durations=10 -o faulthandler_timeout=60

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: src/tessera/data/web
          if-no-files-found: error

  # Distribution proof: the UI survives checkout -> sdist -> downstream wheel rebuild.
  build:
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: src/tessera/data/web
      - run: uv build
      - run: uvx twine check dist/*
      - name: Rebuild and exercise the wheel from the sdist
        run: bash scripts/wheel-gate.sh
      - name: Reject secrets in distributions
        run: |
          set -euo pipefail
          # Capture each archive listing into a variable first: piping straight into
          # `grep ... && exit 1 || true` makes a tar/unzip read failure (corrupt archive,
          # missing tool) indistinguishable from "no secrets found" under `pipefail`,
          # since grep (the rightmost pipeline stage) still exits 1 on no-match either way.
          sdist_list="$(tar -tzf dist/*.tar.gz)"
          if grep -E '\.env$|\.env\.' <<<"$sdist_list"; then exit 1; fi
          wheel_list="$(unzip -l dist/*.whl)"
          if grep -Ei 'secret|api_key|\.env' <<<"$wheel_list"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist
          if-no-files-found: error

  # Public proof path: the installed wheel must work away from the checkout with no real key.
  quickstart:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: uv venv /tmp/wheel-venv --python 3.12
      - run: uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
      - name: Verify the installed command surface and leave the checkout clean
        run: |
          checkout="$PWD"
          export TESSERA_HOME="$(mktemp -d)"
          T=/tmp/wheel-venv/bin/tessera
          cd "$(mktemp -d)"
          "$T" --version
          "$T" guide --list --json
          "$T" catalog --json > /dev/null
          "$T" report first-contact | grep -q '75%'
          "$T" compare first-contact gpt-4o --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True"
          "$T" run --model anthropic/claude-sonnet-4-6 --dry-run --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['ready'] is False and d['blockers'][0]['fix']=='tessera connect anthropic'"
          printf 'sk-ci-placeholder-key-000000' | "$T" connect anthropic --key-stdin
          test "$(stat -c %a "$TESSERA_HOME/.env")" = 600
          "$T" init demo
          "$T" validate demo
          "$T" ui --check
          "$T" guide agents | grep -q 'tessera run'
          cd "$checkout"
          /tmp/wheel-venv/bin/python -m tessera.factory.export --seed 42 --out /tmp/tessera-demo
          test -s /tmp/tessera-demo/meridian-seed42.blueprint.json
          test -s /tmp/tessera-demo/meridian-seed42.answers.json
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # The single-contract gate: regenerate openapi.json + the SPA's generated types
  # and fail if they differ from what's committed. fastapi/pydantic are pinned to
  # the versions the committed schema was generated with — schema emission details
  # shift across their minors, so a dep bump means regenerate + update these pins.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e . "fastapi==0.136.3" "pydantic==2.13.4"
      - run: npm ci
        working-directory: web
      - run: PYTHON=python bash scripts/gen-types.sh
      - name: Fail on contract drift
        run: git diff --exit-code -- openapi.json web/src/api-types.gen.ts

  # The leaderboard is a deterministic render of docs/leaderboard.rows.json (ADR-0010):
  # regenerate the Markdown from the committed manifest and fail if it differs. A row
  # hand-typed into the table, or a manifest that violates the ADR-0006 comparability
  # guard (render exits non-zero), fails the build. The manifest is the reviewable source.
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - run: tessera leaderboard render --manifest docs/leaderboard.rows.json -o docs/leaderboard.md
      - name: Fail on leaderboard drift
        run: git diff --exit-code -- docs/leaderboard.md
      # For every row backed by a committed log (ADR-0012): re-derive it from the log and
      # fail on any digest or metric mismatch. Rows with log:null are unbacked, not failures.
      - name: Verify log-backed rows reproduce their numbers
        run: tessera leaderboard verify --manifest docs/leaderboard.rows.json
