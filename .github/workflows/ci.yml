name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Static gates: the lockfile matches pyproject, the three version declarations agree,
  # and ruff is clean under the [tool.ruff] config in pyproject.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: bash scripts/check-version.sh
      - run: uvx ruff@0.16.5 check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The declared floor is python >=3.10; test it (and the newest) rather than only 3.12.
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is key-free by design: no model API key is ever needed here. --frozen
      # installs exactly what uv.lock resolves, so CI tests the environment we ship.
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Public proof path: the README commands must work from a clean checkout with no key.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install -e .
      - run: .venv/bin/tessera-report src/tessera/data/examples/first-contact/log.eval -o /tmp/first-contact.md
      - run: .venv/bin/tessera-variant export --seed 42 --out /tmp/tessera-demo
      - run: .venv/bin/tessera-validate-transfer examples/validation-study.example.json -o /tmp/transfer-validation.md
      - run: .venv/bin/tessera-validate-transfer examples/validation-study.example.json --json -o /tmp/transfer-validation.json
      - name: Verify proof artifacts and leave the checkout clean
        run: |
          test -s /tmp/first-contact.md
          test -s /tmp/transfer-validation.md
          .venv/bin/python -m json.tool /tmp/transfer-validation.json > /dev/null
          test -s /tmp/tessera-demo/meridian-seed42.blueprint.json
          test -s /tmp/tessera-demo/meridian-seed42.answers.json
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # The single-contract gate: regenerate openapi.json + the SPA's generated types
  # and fail if they differ from what's committed. fastapi/pydantic are pinned to
  # the versions the committed schema was generated with — schema emission details
  # shift across their minors, so a dep bump means regenerate + update these pins.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[app]" "fastapi==0.136.3" "pydantic==2.13.4"
      - run: npm ci
        working-directory: web
      - run: PYTHON=python bash scripts/gen-types.sh
      - name: Fail on contract drift
        run: git diff --exit-code -- openapi.json web/src/api-types.gen.ts

  # The leaderboard is a deterministic render of docs/leaderboard.rows.json (ADR-0010):
  # regenerate the Markdown from the committed manifest and fail if it differs. A row
  # hand-typed into the table, or a manifest that violates the ADR-0006 comparability
  # guard (render exits non-zero), fails the build. The manifest is the reviewable source.
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - run: tessera-leaderboard --manifest docs/leaderboard.rows.json -o docs/leaderboard.md
      - name: Fail on leaderboard drift
        run: git diff --exit-code -- docs/leaderboard.md
      # For every row backed by a committed log (ADR-0012): re-derive it from the log and
      # fail on any digest or metric mismatch. Rows with log:null are unbacked, not failures.
      - name: Verify log-backed rows reproduce their numbers
        run: tessera-leaderboard --manifest docs/leaderboard.rows.json --verify
